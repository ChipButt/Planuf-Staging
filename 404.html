<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Planuf Productions</title>
  <script>
    (function(){
      var known=['ideas','budget','marketing','messages','schedule','admin','people','profile'];
      var path=window.location.pathname||'/';
      var parts=path.split('/').filter(Boolean);
      var idx=parts.findIndex(function(p){return known.indexOf(String(p).toLowerCase())!==-1;});
      var baseParts=idx>=0?parts.slice(0,idx):parts.slice(0,-1);
      var route=idx>=0?('/'+parts.slice(idx).join('/')):'/';
      var base='/' + (baseParts.length?baseParts.join('/') + '/':'');
      var search=window.location.search||'';
      var hash=window.location.hash&&window.location.hash.startsWith('#/')?window.location.hash:('#'+route);
      window.location.replace(window.location.origin + base + 'index.html' + search + hash);
    })();
  </script>
</head>
<body style="margin:0;background:#9381FF;color:#fff;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;">
  <p>Loading Planuf...</p>

<style id="planuf-v59-chat-bubble-alignment-style">
/* V59: Chat bubbles - own messages right/light blue, other messages left/white. */
.conversation-body{
  display:flex!important;
  flex-direction:column!important;
  align-items:stretch!important;
  gap:8px!important;
}
.conversation-body .message,
.conversation-body article.message,
.conversation-body [data-message-id]{
  width:auto!important;
  max-width:66.666%!important;
  min-width:0!important;
  margin-top:4px!important;
  margin-bottom:4px!important;
  padding:9px 11px!important;
  border:2px solid #000!important;
  border-radius:16px!important;
  color:#000!important;
  overflow-wrap:anywhere!important;
  word-break:break-word!important;
  box-shadow:none!important;
}
.conversation-body .message.own,
.conversation-body article.message.own,
.conversation-body [data-message-owner="self"],
.conversation-body [data-from="self"],
.conversation-body [data-current-user-message="true"],
.conversation-body [data-message-id].own{
  align-self:flex-end!important;
  margin-left:auto!important;
  margin-right:0!important;
  background:#23C9FF!important;
  border-bottom-right-radius:6px!important;
  text-align:left!important;
}
.conversation-body .message:not(.own),
.conversation-body article.message:not(.own),
.conversation-body [data-message-id]:not(.own):not([data-message-owner="self"]):not([data-from="self"]):not([data-current-user-message="true"]){
  align-self:flex-start!important;
  margin-left:0!important;
  margin-right:auto!important;
  background:#ffffff!important;
  border-bottom-left-radius:6px!important;
  text-align:left!important;
}
.conversation-body .message p,
.conversation-body article.message p,
.conversation-body [data-message-id] p{
  margin:0!important;
  color:#000!important;
  line-height:1.28!important;
}
.conversation-body .message small,
.conversation-body article.message small,
.conversation-body [data-message-id] small{
  display:block!important;
  margin-top:4px!important;
  color:#333!important;
  font-size:10px!important;
  line-height:1.1!important;
}
.conversation-body .message.own small,
.conversation-body article.message.own small,
.conversation-body [data-message-id].own small{
  text-align:right!important;
}
@media (max-width:430px){
  .conversation-body .message,
  .conversation-body article.message,
  .conversation-body [data-message-id]{
    max-width:66.666%!important;
  }
}
</style>
<script id="planuf-v59-chat-bubble-alignment-script">
(function(){
  if(window.__PLANUF_V59_CHAT_BUBBLES__) return;
  window.__PLANUF_V59_CHAT_BUBBLES__=true;
  function classify(){
    var body=document.querySelector('.conversation-body');
    if(!body) return;
    body.querySelectorAll('.message,[data-message-id]').forEach(function(el){
      var cls=el.className||'';
      var text=(el.getAttribute('data-sender')||el.getAttribute('data-from')||el.getAttribute('data-user')||'').toLowerCase();
      if(String(cls).includes('own') || text==='self' || text==='me' || el.getAttribute('data-current-user-message')==='true'){
        el.classList.add('own');
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',classify); else classify();
  window.addEventListener('hashchange',function(){setTimeout(classify,120)});
  window.addEventListener('planuf-message-auto-refresh',function(){setTimeout(classify,120)});
  window.addEventListener('planuf-soft-message-refresh',function(){setTimeout(classify,120)});
  var obs=new MutationObserver(function(){classify();});
  obs.observe(document.body||document.documentElement,{childList:true,subtree:true});
})();
</script>

</body>
</html>
